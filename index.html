<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mini projet - Vue.js</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    img {
      float: left;
      margin-right: 1rem;
      border-radius: 50%;
    }
    .personne {
      clear: left;
      padding: 1rem;
      border-bottom: 1px solid #ccc;
    }
    .misEnForme {
      background-color: #e0ffff;
      font-family: Georgia, serif;
      font-size: 1.1rem;
    }
    fieldset {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- 🔍 Filtre nom -->
  <fieldset>
    <legend>Filtrer par nom</legend>
    <input type="text" v-model="filtreNom" placeholder="Tapez un nom...">
  </fieldset>

  <!-- ⚙️ Options -->
  <fieldset>
    <legend>Options</legend>
    Homme <input type="checkbox" v-model="homme">
    Femme <input type="checkbox" v-model="femme">
    Afficher contact <input type="checkbox" v-model="afficherContact">
    Photo :
    <select v-model="taille">
      <option value="thumbnail">Petite</option>
      <option value="medium">Moyenne</option>
      <option value="large">Grande</option>
    </select>
    Mise en forme <input type="checkbox" v-model="mef">
  </fieldset>

  <!-- 👤 Liste des personnes -->
  <div v-for="p in personnesFiltrees" :key="p.login.uuid"
       class="personne"
       :class="{misEnForme: mef}">

    <img :src="p.picture[taille]" alt="photo">
    <strong>{{ p.name.title }} {{ p.name.first }} {{ p.name.last }}</strong><br>
    Pays : {{ p.location.country }}<br>

    <div v-if="afficherContact">
      📞 {{ p.phone }}<br>
      ✉️ {{ p.email }}
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      homme: true,
      femme: true,
      afficherContact: false,
      mef: false,
      taille: "medium",
      filtreNom: "",
      personnes: [] // sera rempli dans mounted()
    };
  },
  computed: {
    personnesFiltrees() {
      return this.personnes.filter(p => {
        const genreOK =
          (this.homme && p.gender === "male") ||
          (this.femme && p.gender === "female");
        const nomOK = p.name.last
          .toLowerCase()
          .includes(this.filtreNom.toLowerCase());
        return genreOK && nomOK;
      });
    }
  },
  mounted() {
    // ici on charge les données locales directement (copiées depuis ton JSON)
    this.personnes = [
      {
        "gender": "female",
        "name": { "title": "Mrs", "first": "Elizabeth", "last": "Ambrose" },
        "location": { "country": "Canada" },
        "email": "elizabeth.ambrose@example.com",
        "phone": "366-033-8063",
        "picture": {
          "large": "https://randomuser.me/api/portraits/women/49.jpg",
          "medium": "https://randomuser.me/api/portraits/med/women/49.jpg",
          "thumbnail": "https://randomuser.me/api/portraits/thumb/women/49.jpg"
        },
        "login": { "uuid": "50777e60-394d-4951-b933-a2f78599065d" }
      },
      {
        "gender": "male",
        "name": { "title": "Mr", "first": "Batista", "last": "Silveira" },
        "location": { "country": "Brazil" },
        "email": "batista.silveira@example.com",
        "phone": "(53) 5553-2892",
        "picture": {
          "large": "https://randomuser.me/api/portraits/men/50.jpg",
          "medium": "https://randomuser.me/api/portraits/med/men/50.jpg",
          "thumbnail": "https://randomuser.me/api/portraits/thumb/men/50.jpg"
        },
        "login": { "uuid": "5308f02b-7838-4b48-8114-2fe1349c0819" }
      },
      {
        "gender": "male",
        "name": { "title": "Mr", "first": "Blaise", "last": "Adam" },
        "location": { "country": "Switzerland" },
        "email": "blaise.adam@example.com",
        "phone": "079 493 00 77",
        "picture": {
          "large": "https://randomuser.me/api/portraits/men/29.jpg",
          "medium": "https://randomuser.me/api/portraits/med/men/29.jpg",
          "thumbnail": "https://randomuser.me/api/portraits/thumb/men/29.jpg"
        },
        "login": { "uuid": "3f7d9b90-8858-4986-bdf3-075df560ce31" }
      }
    ];
  }
}).mount("#app");
</script>

</body>
</html>
